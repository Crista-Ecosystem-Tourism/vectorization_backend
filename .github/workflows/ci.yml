name: Vectorization CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: vectorization-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  import-security-and-etl-contract:
    name: Import security and ETL contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_import_security tests.test_text_preparer_contract
